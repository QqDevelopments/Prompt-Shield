name: prompt-shield-test
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: promptshield
      POSTGRES_USER: promptshield
      POSTGRES_PASSWORD: synthetic-local-integration-password
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptshield -d promptshield"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs: /var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:16379:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
