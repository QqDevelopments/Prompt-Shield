# Mount the same dist directory at /srv/prompt-shield on any static host.
# Terminate HTTPS at the owned domain's ingress. Replace the example API origin.
server {
    listen 8080;
    root /srv/prompt-shield;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://api.example.test; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /config.json { expires -1; }
    location / { try_files $uri $uri/ /index.html; }
}
