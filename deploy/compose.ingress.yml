# Community hosted overlay. Configure the exact HTTPS origin and independent
# METRICS_TOKEN in .env. Keep exactly one public entry path through ingress.
services:
  gateway:
    environment:
      TRUSTED_PROXY_CIDRS: ${INGRESS_PRIVATE_IP:-172.30.90.2}/32
    networks:
      services: {}
      egress: {}
      admission:
        ipv4_address: ${INGRESS_GATEWAY_IP:-172.30.90.3}
  ingress:
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
      target: ingress
    restart: unless-stopped
    ports: ["127.0.0.1:8084:8080"]
    environment:
      ENVIRONMENT: production
      INGRESS_UPSTREAM: http://gateway:8080
      INGRESS_PRODUCT: community
      INGRESS_REDIS_URL: redis://ingress-redis:6379/0
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the exact HTTPS frontend origin}
      PUBLIC_HMAC_KEY: ${PUBLIC_HMAC_KEY:?Set the public HMAC secret}
      METRICS_TOKEN: ${METRICS_TOKEN:?Set an independent metrics token, at least 32 characters}
      PUBLIC_DAILY_IP_LIMIT_ENABLED: ${PUBLIC_DAILY_IP_LIMIT_ENABLED:-true}
      TRUSTED_PROXY_CIDRS: ${INGRESS_HOST_PROXY_CIDR:-172.30.91.1/32}
    depends_on:
      gateway: {condition: service_healthy}
      ingress-redis: {condition: service_healthy}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, /ingress, -healthcheck]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      admission:
        ipv4_address: ${INGRESS_PRIVATE_IP:-172.30.90.2}
      edge:
        ipv4_address: ${INGRESS_EDGE_IP:-172.30.91.2}
  ingress-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --maxmemory, 64mb, --maxmemory-policy, noeviction, --appendonly, "yes", --appendfsync, always, --save, ""]
    volumes: ["ingress-data:/data"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      admission:
        ipv4_address: ${INGRESS_REDIS_IP:-172.30.90.4}
networks:
  edge:
    ipam:
      config:
        - subnet: ${INGRESS_EDGE_SUBNET:-172.30.91.0/29}
  admission:
    internal: true
    ipam:
      config:
        - subnet: ${INGRESS_SUBNET:-172.30.90.0/29}
volumes:
  ingress-data: {}
