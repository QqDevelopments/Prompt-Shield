<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Prompt Shield is an ultra-fast AI security gateway, prompt security, and PII sanitization engine for LLM workloads built with Rust and Go."
    />
    <meta
      name="keywords"
      content="Prompt Shield, prompt security, AI security gateway, LLM security, PII sanitization, prompt injection protection"
    />
    <script>
      (() => {
        let theme = "system";
        try {
          const saved = localStorage.getItem("ps.theme.v1");
          if (saved === "light" || saved === "dark" || saved === "system") {
            theme = saved;
          }
        } catch {
          // Preferences are optional.
        }
        const dark =
          theme === "dark" ||
          (theme === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <title>Prompt Shield — AI Security Gateway & LLM Prompt Protection</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
